# This service only. <abbr>-infra includes this file to compose the platform.
name: abbr-orders-api

services:
  orders-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://orders-db:5432/${ORDERS_DB_NAME:-orders}
      DATABASE_USER: ${ORDERS_DB_USER:-orders_owner}
      DATABASE_PASSWORD: ${ORDERS_DB_PASSWORD:?set ORDERS_DB_PASSWORD}
      # Public key of the identity service, one line with \n escapes.
      # <abbr>-infra/scripts/dev-keys.sh generates a development pair.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run <abbr>-infra/scripts/dev-keys.sh}
      DB_POOL_MAX: "10"
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["8080"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
