# Routes of the orders domain. This file belongs to the team that owns orders.
location /api/v1/orders {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    # A variable forces per-request resolution (see 00-resolver.conf).
    set $orders_api http://orders-api:8080;
    proxy_pass $orders_api;
}
