# Routes of <abbr>-workflow. Same filter as a domain route: the workflow validates
# the token itself.
location /api/v1/sagas {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $workflow http://workflow:8081;
    proxy_pass $workflow;
    proxy_read_timeout 60s;   # a saga calls several services in sequence
}
