# This domain's own database instance and its migration runner (Flyway).
# Joins the shared `platform` network so that <abbr>-infra can compose it
# together with the rest of the system.
name: abbr-orders-db

services:
  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME:-orders}
      POSTGRES_USER: ${ORDERS_DB_USER:-orders_owner}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?set ORDERS_DB_PASSWORD}
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDERS_DB_USER:-orders_owner} -d ${ORDERS_DB_NAME:-orders}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [platform]

  orders-db-migrate:
    image: flyway/flyway:11.20
    profiles: [tooling]
    depends_on:
      orders-db:
        condition: service_healthy
    volumes:
      - ../:/workspace:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://orders-db:5432/${ORDERS_DB_NAME:-orders}
      FLYWAY_USER: ${ORDERS_DB_USER:-orders_owner}
      FLYWAY_PASSWORD: ${ORDERS_DB_PASSWORD:?set ORDERS_DB_PASSWORD}
    entrypoint: ["flyway", "-workingDirectory=/workspace", "-configFiles=flyway.toml"]
    command: ["migrate"]
    networks: [platform]

volumes:
  orders-db-data:

networks:
  platform:
    name: platform
    external: true
