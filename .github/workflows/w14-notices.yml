# Week 14 challenge: the pipeline of the notices service runs only when its own folder changes (path filter).
name: w14-notices

on:
  push:
    branches: [main]
    paths:
      - "14-week/challenge/services/notices/**"
  workflow_dispatch:

concurrency:
  group: w14-notices-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/w14-go-gates.yml
    with:
      dir: 14-week/challenge/services/notices
